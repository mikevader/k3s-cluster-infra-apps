---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd-system
  annotations:
    kubernetes.io/ingress.class: "traefik"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Argo CD"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "argo-cd.png"
    gethomepage.dev/description: "GitOps continuous delivery"
    gethomepage.dev/href: "https://argocd.framsburg.ch"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=argocd-server"
    gethomepage.dev/widget.type: "argocd"
    gethomepage.dev/widget.url: "http://argo-cd-argocd-server.argocd-system"
    gethomepage.dev/widget.key: {{ "\"{{HOMEPAGE_VAR_ARGOCD_KEY}}\"" }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.framsburg.ch`)
      priority: 10
      services:
        - name: argo-cd-argocd-server
          namespace: argocd-system
          port: 80
    - kind: Rule
      match: Host(`argocd.framsburg.ch`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argo-cd-argocd-server
          namespace: argocd-system
          port: 80
          scheme: h2c
  tls:
    certResolver: letsencrypt
    secretName: argocd-framsburg-ch-tls
