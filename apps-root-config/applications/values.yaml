---
# Chart defaults, shared by every app-of-apps group (cluster-*.yaml).
# Argo CD passes the group file via `valueFiles`; Helm always loads this file underneath it.

# Pod Security Admission levels applied as labels to every namespace created by this chart.
# https://kubernetes.io/docs/concepts/security/pod-security-admission/
#
# - enforce: pods violating this level are rejected
# - audit:   violations are recorded in the API server audit log
# - warn:    violations are returned as warnings to the client (kubectl, Argo CD)
#
# Levels: privileged | baseline | restricted. An empty value leaves the mode unset.
# Opt out per application in the group file, e.g.:
#
#   applications:
#     longhorn-system:
#       podSecurity:
#         enforce: privileged
#         warn: privileged
#
podSecurity:
  enforce: baseline
  audit: restricted
  warn: restricted
  # Policy version the levels are evaluated against ("latest" or e.g. "v1.35")
  version: latest

# What Argo CD does with an application's resources when the application is removed from its
# group file (or its Application is deleted). Applied to the Application and to the Namespace
# this chart creates for it.
#
# - delete:   cascade-delete everything right away (resources finalizer, no sync-options).
# - confirm:  cascade-delete only after manual approval. Sets Prune=confirm,Delete=confirm, so the
#             parent's sync waits until you approve in the UI or annotate the parent Application
#             with `argocd.argoproj.io/deletion-approved: <ISO timestamp>`. Moving an app to another
#             group is safe: the new parent adopts the Application and Namespace and the pending
#             prune goes away.
# - preserve: never delete. No resources finalizer and Prune=false,Delete=false; leftovers are
#             cleaned up by hand.
#
# Override per group in cluster-*.yaml (top-level `onRemoval:`) and per application:
#
#   applications:
#     actual:
#       onRemoval: preserve
#
# https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
onRemoval: confirm
