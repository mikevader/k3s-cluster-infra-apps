---
repository: https://github.com/mikevader/k3s-cluster-infra-apps.git
# argocdNamespace: "argocd"
# server: "https://kubernetes.default.svc"
subFolder: cluster-test
namespace:
  annotations: {}
  labels:
    client: cluster-infra

enableDefaultNetworkPolicy: false
enableDefaultLimitRange: false
allowAllNamespaces: true

roleBindings:
#  - groupName: "team1"
#    clusterRoleName: "admin"

clusterResourceWhitelist:
  - group: "*"
    kind: "*"

namespaceResourceBlacklist:
#  - group: 'apps'
#    kind: 'DaemonSet'

# Default onRemoval for this group (test apps: remove everything right away); see values.yaml
onRemoval: delete

applications:
  forecastle: {}
  hajimari: {}
  hermes: {}
  homarr: {}
  # homer: {}
  httpbin:
    helmServerSideApply: true
    serverSideDiff: true
  openclaw: {}
  paperless: {}
