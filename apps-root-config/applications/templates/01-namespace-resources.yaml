{{- range $key, $value := .Values.applications -}}
{{- $disableNamespaceCreation := false -}}
{{- if . -}}
{{- $disableNamespaceCreation = .disableNamespaceCreation -}}
{{- end }}
{{- if not $disableNamespaceCreation }}
{{- /* Pod Security Admission: chart/group defaults, overridable per application */ -}}
{{- $appPodSecurity := dict -}}
{{- if $value -}}
{{- $appPodSecurity = default dict $value.podSecurity -}}
{{- end -}}
{{- $podSecurity := mustMergeOverwrite (deepCopy (default dict $.Values.podSecurity)) (deepCopy $appPodSecurity) -}}
{{- $labels := deepCopy (default dict $.Values.namespace.labels) -}}
{{- range $mode := list "enforce" "audit" "warn" -}}
{{- with get $podSecurity $mode -}}
{{- $_ := set $labels (printf "pod-security.kubernetes.io/%s" $mode) . -}}
{{- $_ := set $labels (printf "pod-security.kubernetes.io/%s-version" $mode) (default "latest" $podSecurity.version) -}}
{{- end -}}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $key }}
{{- $nsAnnotations := deepCopy (default dict $.Values.namespace.annotations) -}}
{{- /* onRemoval: protect the namespace (and everything in it) from being pruned/deleted by the parent app; an explicit namespace.annotations entry wins */ -}}
{{- $nsSyncOptions := include "apps.onRemovalSyncOptions" (include "apps.onRemoval" (dict "app" $value "root" $)) -}}
{{- if $nsSyncOptions -}}
{{- $_ := set $nsAnnotations "argocd.argoproj.io/sync-options" (get $nsAnnotations "argocd.argoproj.io/sync-options" | default $nsSyncOptions) -}}
{{- end }}
{{ if $nsAnnotations }}
  annotations:
{{ toYaml $nsAnnotations | indent 4 }}
{{- end }}
{{ if $labels }}
  labels:
{{ toYaml $labels | indent 4 }}
{{- end }}
{{- if $.Values.enableDefaultLimitRange }}
{{- $limitRange := include "apps.appSetting" (dict "key" "limitRange" "app" $value "root" $) | fromYaml }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: core-resource-limits
  namespace: "{{ $key }}"
spec:
  limits:
{{ toYaml $limitRange.limits | indent 4 }}
{{- end }}
{{- if $.Values.enableDefaultResourceQuota }}
{{- $resourceQuota := include "apps.appSetting" (dict "key" "resourceQuota" "app" $value "root" $) | fromYaml }}
{{- if $resourceQuota.hard }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: core-resource-quota
  namespace: "{{ $key }}"
spec:
  hard:
{{ toYaml $resourceQuota.hard | indent 4 }}
{{- end }}
{{- end }}
{{- if $.Values.enableVaultSecretStore }}
{{- $vaultStore := include "apps.appSetting" (dict "key" "vaultSecretStore" "app" $value "root" $) | fromYaml }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $vaultStore.serviceAccountName }}
  namespace: {{ $key }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $vaultStore.name }}
  namespace: {{ $key }}
spec:
  provider:
    vault:
      server: {{ $vaultStore.server | quote }}
      path: {{ $vaultStore.path | quote }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: {{ $vaultStore.mountPath | quote }}
          role: {{ required "vaultSecretStore.role is required with enableVaultSecretStore" $vaultStore.role | quote }}
          serviceAccountRef:
            name: {{ $vaultStore.serviceAccountName }}
{{- end }}
{{- if $.Values.enableDefaultNetworkPolicy }}
{{- $networkPolicy := include "apps.appSetting" (dict "key" "networkPolicy" "app" $value "root" $) | fromYaml }}
{{- with $networkPolicy.ingressFromNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-k3s-ingress
  namespace: {{ $key }}
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
{{ toYaml . | indent 18 }}
  podSelector: {}
  policyTypes:
    - Ingress
{{- end }}
{{- with $networkPolicy.extraIngress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-extra-ingress
  namespace: {{ $key }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
{{ toYaml . | indent 4 }}
{{- end }}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-same-namespace
  namespace: {{ $key }}
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: deny-by-default
  namespace: {{ $key }}
spec:
  podSelector: {}
  ingress: []
{{- $egress := default dict $networkPolicy.egress }}
{{- if $egress.enabled }}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: restrict-egress
  namespace: {{ $key }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # same namespace
    - to:
        - podSelector: {}
    # cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if $egress.allowInternet }}
    # internet (everything outside the cluster and LAN ranges)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
{{- with $egress.internetExcept }}
            except:
{{ toYaml . | indent 14 }}
{{- end }}
{{- end }}
{{- with $networkPolicy.extraEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{ range $.Values.roleBindings -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s" .name .clusterRoleName}}
  namespace: "{{ $key }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .clusterRoleName }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: {{ .kind }}
    name: {{ .name }}
{{ end }}
{{ end }}
{{ end }}
