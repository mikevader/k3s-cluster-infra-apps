---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-api-keys
  labels:
    app.kubernetes.io/part-of: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homepage-api-keys
  data:
    {{- range .Values.apiKeys.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.apiKeys.vaultKey }}
        property: {{ . }}
    {{- end }}
