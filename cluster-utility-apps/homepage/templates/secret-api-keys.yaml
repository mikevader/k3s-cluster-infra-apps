---
# Every property under the Vault path becomes an env var of the same name, so
# new widget keys only need a `vault kv patch` (no change here). Name them
# HOMEPAGE_VAR_<APP>_KEY (see docs/apps/homepage.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-api-keys
  labels:
    app.kubernetes.io/part-of: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homepage-api-keys
  dataFrom:
    - extract:
        key: '{{ .Values.apiKeys.vaultKey }}'
