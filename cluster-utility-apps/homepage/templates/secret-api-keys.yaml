---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-api-keys
  labels:
    app.kubernetes.io/part-of: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homepage-api-keys
  data:
    - secretKey: HOMEPAGE_VAR_ARGOCD_KEY
      remoteRef:
        key: '{{ .Values.apiKeys.vaultKey }}'
        property: HOMEPAGE_VAR_ARGOCD_KEY
    - secretKey: HOMEPAGE_VAR_JELLYFIN_KEY
      remoteRef:
        key: '{{ .Values.apiKeys.vaultKey }}'
        property: HOMEPAGE_VAR_JELLYFIN_KEY
    - secretKey: HOMEPAGE_VAR_PLEX_KEY
      remoteRef:
        key: '{{ .Values.apiKeys.vaultKey }}'
        property: HOMEPAGE_VAR_PLEX_KEY
