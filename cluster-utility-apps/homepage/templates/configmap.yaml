---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true
    gateway: true
  settings.yaml: |
    title: Framsburg
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    statusStyle: dot
    layout:
      Infrastructure:
        style: row
        columns: 4
      Platform:
        style: row
        columns: 4
      Media:
        style: row
        columns: 4
      Utilities:
        style: row
        columns: 4
      RPG:
        style: row
        columns: 4
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank
  services.yaml: ""
  bookmarks.yaml: ""
  custom.css: ""
  custom.js: ""
  docker.yaml: ""
  proxmox.yaml: ""
