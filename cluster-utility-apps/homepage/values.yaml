---
host: home.framsburg.ch

image:
  repository: ghcr.io/gethomepage/homepage
  # renovate: image=ghcr.io/gethomepage/homepage
  tag: v2.8.0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Vault path holding widget API keys (HOMEPAGE_VAR_* env vars).
# The keys themselves are listed in templates/secret-api-keys.yaml.
apiKeys:
  vaultKey: secret/data/framsburg/homepage

background:
  image: https://images.unsplash.com/photo-1672872476232-da16b45c9001?auto=format&fit=crop&w=2560&q=80
