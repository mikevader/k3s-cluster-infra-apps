---
host: home.framsburg.ch

image:
  repository: ghcr.io/gethomepage/homepage
  # renovate: image=ghcr.io/gethomepage/homepage
  tag: v2.8.0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Vault path holding widget API keys (HOMEPAGE_VAR_* env vars)
apiKeys:
  vaultKey: secret/data/framsburg/homepage
  keys:
    - HOMEPAGE_VAR_ARGOCD_KEY
    - HOMEPAGE_VAR_JELLYFIN_KEY
