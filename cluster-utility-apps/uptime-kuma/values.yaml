---
global:
  domainName: kuma.framsburg.ch

uptime-kuma:
  env:
    TZ: Europe/Zurich
  persistence:
    data:
      enabled: true
      type: pvc
      size: 2Gi
      accessMode: ReadWriteOnce
  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Uptime Kuma"
        gethomepage.dev/group: "Observability"
        gethomepage.dev/icon: "uptime-kuma.png"
        gethomepage.dev/description: "Service uptime monitoring"
        gethomepage.dev/pod-selector: ""
      hosts:
        - host: '{{ .Values.global.domainName }}'
          paths:
            - path: /
              pathType: Prefix
              service:
                name: uptime-kuma
      tls:
        - hosts: ['{{ .Values.global.domainName }}']
          secretName: '{{ .Values.global.domainName | replace "." "-" }}-tls'
    external:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        # traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: '{{ .Values.global.domainName }}'
          paths:
            - path: /
              pathType: Prefix
              service:
                name: uptime-kuma
      tls:
        - hosts: ['{{ .Values.global.domainName }}']
          secretName: '{{ .Values.global.domainName | replace "." "-" }}-tls-external'
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 192Mi
