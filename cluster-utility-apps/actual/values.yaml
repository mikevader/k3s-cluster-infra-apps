---
actual:

  strategy:
    type: Recreate

  podAnnotations:
    reloader.stakater.com/auto: "true"

  image:
    # renovate: actualbudget/actual-server
    tag: 26.11.0
  login:
    method: "openid"
    openid:
      enforce: true
      providerName: "Authentik"
      discoveryUrl: "https://authentik.framsburg.ch/application/o/actual/"
      tokenExpiration: 3600
      existingSecret:
        name: "actualbudget-openid-secret"
        clientIdKey: "clientId"
        clientSecretKey: "clientSecret"

  ingress:
    enabled: true
    annotations:
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Actual"
      gethomepage.dev/group: "Household"
      gethomepage.dev/icon: "actual-budget.png"
      gethomepage.dev/description: "Personal finance"
      gethomepage.dev/pod-selector: ""
    hosts:
      - host: 'actual.framsburg.ch'
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts: ['actual.framsburg.ch']
        secretName: 'actual-framsburg-ch-tls'

  persistence:
    enabled: true
