---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-oidc-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mealie-oidc-secret
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: secret/data/framsburg/mealie/oidc
        property: clientId
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: secret/data/framsburg/mealie/oidc
        property: clientSecret
