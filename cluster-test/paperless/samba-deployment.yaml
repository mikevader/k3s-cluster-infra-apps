---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-samba
  labels:
    app.kubernetes.io/name: paperless-samba
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-samba
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-samba
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Enforce the write-only drop-box permissions on every start:
        # owner paperless (1000) rwx, group/other -wx, setgid + sticky
        - name: init-permissions
          image: docker.io/crazymax/samba:4.23.8
          command: ["sh", "-c", "chown 1000:1000 /scans && chmod 3733 /scans && ls -ld /scans"]
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: consume
              mountPath: /scans
      containers:
        - name: samba
          image: docker.io/crazymax/samba:4.23.8
          command: ["/bin/sh", "/config/start.sh"]
          ports:
            - name: smb
              containerPort: 445
          envFrom:
            - secretRef:
                name: samba-secret
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "NET_BIND_SERVICE"]
          readinessProbe:
            tcpSocket:
              port: smb
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["smbcontrol", "smbd", "ping"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/samba/smb.conf
              subPath: smb.conf
            - name: config
              mountPath: /config/start.sh
              subPath: start.sh
            - name: consume
              mountPath: /scans
      volumes:
        - name: config
          configMap:
            name: samba-config
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume
