---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: paperless-secret
    template:
      engineVersion: v2
      data:
        PAPERLESS_SECRET_KEY: "{{ .secretKey }}"
        PAPERLESS_ADMIN_USER: "{{ .adminUser }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .adminPassword }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
          {"openid_connect": {"OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "authentik", "name": "authentik", "client_id": "{{ .clientId }}", "secret": "{{ .clientSecret }}", "settings": {"server_url": "https://authentik.framsburg.ch/application/o/paperless/.well-known/openid-configuration"}}]}}
  data:
    - secretKey: secretKey
      remoteRef:
        key: secret/data/framsburg/test/paperless/app
        property: secret_key
    - secretKey: adminUser
      remoteRef:
        key: secret/data/framsburg/test/paperless/app
        property: admin_user
    - secretKey: adminPassword
      remoteRef:
        key: secret/data/framsburg/test/paperless/app
        property: admin_password
    - secretKey: clientId
      remoteRef:
        key: secret/data/framsburg/test/paperless/oidc
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: secret/data/framsburg/test/paperless/oidc
        property: clientSecret
