---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: samba-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: samba-secret
  data:
    - secretKey: SCANNER_PASSWORD
      remoteRef:
        key: secret/data/framsburg/test/paperless/smb
        property: password
