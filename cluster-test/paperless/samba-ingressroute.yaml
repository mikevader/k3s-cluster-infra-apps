---
# SMB is not TLS, so there is no SNI: HostSNI(`*`) claims the whole Traefik `smb`
# entrypoint (port 445 on the Traefik LoadBalancer IP) for this share.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: paperless-samba
spec:
  # Traefik runs with --providers.kubernetescrd.ingressClass=traefik and ignores
  # CRD routes that set neither this nor the kubernetes.io/ingress.class annotation.
  ingressClassName: traefik
  entryPoints:
    - smb
  routes:
    - match: HostSNI(`*`)
      services:
        - name: paperless-samba
          port: 445
