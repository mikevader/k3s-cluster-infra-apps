---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-nolock-nfs
  annotations:
    # reclaimPolicy is immutable: let Argo CD delete and recreate the StorageClass on change.
    # Existing PVs keep their own reclaim policy and are not affected.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
mountOptions:
  - nolock
provisioner: driver.longhorn.io
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  fsType: ext4
  numberOfReplicas: '2'
  staleReplicaTimeout: '30'
  recurringJobSelector: '[
      {
        "name":"backup",
        "isGroup":true
      }
    ]'
