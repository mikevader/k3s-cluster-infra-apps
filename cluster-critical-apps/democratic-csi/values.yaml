---
democratic-csi:
  controller:
    driver:
      logLevel: warn
  csiDriver:
    name: "nfs"
  storageClasses:
    - name: truenas-nfs
      defaultClass: false
      # Keep the TrueNAS dataset when its PVC is deleted.
      reclaimPolicy: Retain
      annotations:
        # reclaimPolicy is immutable: let Argo CD delete and recreate the StorageClass on change.
        argocd.argoproj.io/sync-options: Force=true,Replace=true
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs
        detachedVolumesFromSnapshots: "false"
      mountOptions:
        - noatime
        - nfsvers=3
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:
  volumeSnapshotClasses:
    - name: nfs
      parameters:
        detachedSnapshots: "true"
  driver:
    existingConfigSecret: driver-config-file-secret
    config:
      driver: freenas-api-nfs

  node:
    driver:
      logLevel: warn
