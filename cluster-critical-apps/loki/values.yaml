---
loki:

  loki:
#    commonConfig:
#      replication_factor: 1


    schemaConfig:
      configs:
        - from: "2025-07-07"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: 's3'
      bucketNames:
        chunks: 'loki-chunks'
        ruler: 'loki-ruler'
      s3:
        s3: 'https://minio2.framsburg.net:9000'
        endpoint: 'https://minio2.framsburg.net:9000'
        region: null
        accessKeyId: "${GRAFANA_LOKI_S3_ACCESKEYID}"
        secretAccessKey: "${GRAFANA_LOKI_S3_SECRETACCESSKEY}"
        s3ForcePathStyle: true

  lokiCanary:
    automountServiceAccountToken: false

  deploymentMode: SimpleScalable<->Distributed

  backend:
    replicas: 2
    extraArgs:
      - &extraArgs '-config.expand-env=true'
    extraEnv:
      - &extraEnv1
        name: GRAFANA_LOKI_S3_ACCESKEYID
        valueFrom:
          secretKeyRef:
            name: minio-access
            key: grafana-loki-s3-accessKeyId
      - &extraEnv2
        name: GRAFANA_LOKI_S3_SECRETACCESSKEY
        valueFrom:
          secretKeyRef:
            name: minio-access
            key: grafana-loki-s3-secretAccessKey

  read:
    replicas: 2
    extraArgs:
      - <<: *extraArgs
    extraEnv:
      - <<: *extraEnv1
      - <<: *extraEnv2
  write:
    replicas: 3 # To ensure data durability with replication
    persistence:
      size: 20Gi
    extraArgs:
      - <<: *extraArgs
    extraEnv:
      - <<: *extraEnv1
      - <<: *extraEnv2

  ingester:
    replicas: 3
    extraArgs:
      - <<: *extraArgs
    extraEnv:
      - <<: *extraEnv1
      - <<: *extraEnv2

  distributor:
    replicas: 1

  querier:
    replicas: 1
    extraArgs:
      - <<: *extraArgs
    extraEnv:
      - <<: *extraEnv1
      - <<: *extraEnv2

  queryFrontend:
    replicas: 1

  compactor:
    enabled: true
    replicas: 1
    extraArgs:
      - <<: *extraArgs
    extraEnv:
      - <<: *extraEnv1
      - <<: *extraEnv2

  queryScheduler:
    replicas: 1

  ruler:
    replicas: 1
    extraArgs:
      - <<: *extraArgs
    extraEnv:
      - <<: *extraEnv1
      - <<: *extraEnv2

  indexGateway:
    replicas: 1
    extraArgs:
      - <<: *extraArgs
    extraEnv:
      - <<: *extraEnv1
      - <<: *extraEnv2

  gateway:
    service:
      type: LoadBalancer
