---
vault-operator:
  crdAnnotations:
    "helm.sh/hook": crd-install

  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  readinessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1

  monitoring:
    serviceMonitor:
      enabled: true

  bankVaults:
    image:
      # Overrides the chart's pinned default. Remove once the chart ships >= v1.33.2.
      # renovate: image=ghcr.io/bank-vaults/bank-vaults
      tag: v1.33.2
