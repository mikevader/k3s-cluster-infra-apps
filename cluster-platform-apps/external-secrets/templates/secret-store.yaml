---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  # Not for test apps (namespaces labelled client=cluster-test, see
  # apps-root-config/applications/cluster-test.yaml): each test namespace has its own
  # SecretStore "vault" limited to secret/framsburg/test/<namespace>.
  # NotIn also matches namespaces without a client label.
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: client
            operator: NotIn
            values:
              - cluster-test
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        # Authenticate against Vault using a Kubernetes ServiceAccount
        # token stored in a Secret.
        # https://www.vaultproject.io/docs/auth/kubernetes
        kubernetes:
          # Path where the Kubernetes authentication backend is mounted in Vault
          mountPath: "kubernetes"
          # A required field containing the Vault Role to assume.
          role: "externalsecrets"
          # Optional service account field containing the name
          # of a kubernetes ServiceAccount
          serviceAccountRef:
            name: "vault-account"
            namespace: "external-secrets"
