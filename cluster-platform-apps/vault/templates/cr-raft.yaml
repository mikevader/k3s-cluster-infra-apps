---
apiVersion: "vault.banzaicloud.com/v1alpha1"
kind: "Vault"
metadata:
  name: "vault"
spec:
  size: 3
  image: hashicorp/vault:2.2.2
  # bankVaultsImage: ghcr.io/banzaicloud/bank-vaults:latest

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: "{{ .Release.Name }}"

  # Specify the ServiceAccount where the Vault Pod and the Bank-Vaults configurer/unsealer is running
  serviceAccount: vault

  # Request an Ingress controller with the default configuration
  ingress:
    # Specify Ingress object annotations here, if TLS is enabled (which is by default)
    # the operator will add NGINX, Traefik and HAProxy Ingress compatible annotations
    # to support TLS backends
    annotations:
      kubernetes.io/ingress.class: "traefik"
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Vault"
      gethomepage.dev/group: "Identity & Secrets"
      gethomepage.dev/icon: "vault.png"
      gethomepage.dev/description: "Secrets management"
      gethomepage.dev/pod-selector: ""
    # Override the default Ingress specification here
    # This follows the same format as the standard Kubernetes Ingress
    # See: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.13/#ingressspec-v1beta1-extensions
    spec:
      rules:
        - host: 'vault.framsburg.ch'
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: vault
                    port:
                      number: 8200
      tls:
        - hosts: ['vault.framsburg.ch']
          secretName: 'vault-framsburg-ch-tls'

  # A YAML representation of a final vault config file.
  # See https://www.vaultproject.io/docs/configuration/ for more information.
  config:
    storage:
      raft:
        path: /vault/file
    listener:
      tcp:
        address: "0.0.0.0:8200"
        # Uncommenting the following line and deleting tls_cert_file and tls_key_file disables TLS
        tls_disable: true
        # tls_cert_file: /vault/tls/server.crt
        # tls_key_file: /vault/tls/server.key
    telemetry:
      disable_hostname: true
      prometheus_retention_time: "12h"
      statsd_address: localhost:9125
    api_addr: http://vault.vault.svc:8200
    cluster_addr: "http://${.Env.POD_NAME}:8201"
    ui: true
    disable_mlock: true

  # See: https://banzaicloud.com/docs/bank-vaults/cli-tool/#example-external-vault-configuration
  # The repository also contains a lot examples in the deploy/ and operator/deploy directories.
  externalConfig:
    policies:
      # Full access, for people only (OIDC login). Secrets outside secret/framsburg/ are
      # personal and not readable by any workload.
      - name: allow_secrets
        rules: path "secret/*" {
          capabilities = ["create", "read", "update", "patch", "delete", "list"]
          }
      # Read-only access for workloads (ClusterSecretStore vault-backend)
      - name: framsburg_read
        rules: |
          path "secret/data/framsburg/*" { capabilities = ["read"] }
      # Read-only access for test namespaces (role test-namespace): each namespace reads only
      # secret/framsburg/test/<its namespace>[/...]. The namespace comes from the logged-in
      # ServiceAccount (templated policy); ${ accessor } is resolved by the configurer.
      # https://developer.hashicorp.com/vault/docs/concepts/policies#templated-policies
      - name: test_namespace_read
        rules: |
          path "secret/data/framsburg/test/{{ "{{" }}identity.entity.aliases.${ accessor `kubernetes/` }.metadata.service_account_namespace{{ "}}" }}" { capabilities = ["read"] }
          path "secret/data/framsburg/test/{{ "{{" }}identity.entity.aliases.${ accessor `kubernetes/` }.metadata.service_account_namespace{{ "}}" }}/*" { capabilities = ["read"] }
          # secrets shared by the whole cluster-test group (framsburg/test/shared/)
          path "secret/data/framsburg/test/shared/*" { capabilities = ["read"] }
    auth:
      - type: kubernetes
        roles:
          # External Secrets is the only way workloads get secrets. Roles removed from this
          # list are not deleted by the configurer; delete them in Vault by hand:
          #   vault delete auth/kubernetes/role/<name>
          # Removed so far: default, test, grafana, argocd, renovate, vault, externalsecrets-test
          # (removed policies likewise: vault policy delete test_secrets)
          - name: externalsecrets
            bound_service_account_names: ["external-secrets", "external-secrets-webhook", "vault-account"]
            bound_service_account_namespaces: ["external-secrets"]
            policies: ["framsburg_read"]
            ttl: 1h
          # SecretStore "vault" + ServiceAccount "vault-reader" in every client=cluster-test
          # namespace, created by apps-root-config (enableVaultSecretStore)
          - name: test-namespace
            bound_service_account_names: ["vault-reader"]
            bound_service_account_namespace_selector: '{"matchLabels":{"client":"cluster-test"}}'
            policies: ["test_namespace_read"]
            ttl: 1h

      - type: oidc
        config:
          role_type: oidc
          oidc_discovery_url: "${env `OIDC_DISCOVERY_URL`}"
          oidc_client_id: "${env `OIDC_CLIENT_ID`}"
          oidc_client_secret: "${env `OIDC_CLIENT_SECRET`}"
          allowed_redirect_uris: ["https://vault.framsburg.ch", "https://vault.framsburg.ch/ui/vault/auth/oidc/oidc/callback"]
          default_role: default

        roles:
          - name: default
            oidc_scopes: ["openid", "profile", "email"]
            user_claim: sub
            policies: allow_secrets
            # localhost callback is used by `vault login -method=oidc` (CLI)
            allowed_redirect_uris:
              - "https://vault.framsburg.ch"
              - "https://vault.framsburg.ch/ui/vault/auth/oidc/oidc/callback"
              - "http://localhost:8250/oidc/callback"
            ttl: 1h

    secrets:
      - path: secret
        type: kv
        description: General secrets.
        options:
          version: 2

  vaultEnvsConfig:
    - name: VAULT_LOG_LEVEL
      value: info

  envsConfig:
    - name: OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: vault-oidc-secret
          key: oidc-id
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: vault-oidc-secret
          key: oidc-secret
    - name: OIDC_DISCOVERY_URL
      value: https://authentik.framsburg.ch/application/o/vault/

  serviceRegistrationEnabled: true

  # Give a (re)joining raft node time to unseal and receive the snapshot from the
  # leader before the liveness probe kills it. /sys/health returns 501 while the
  # node is not yet initialized, so the default (3 x 10s, no delay) can kill it
  # mid-join and leave it in a restart loop.
  vaultContainerSpec:
    name: vault
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

  resources:
    # A YAML representation of resource ResourceRequirements for vault container
    # Detail can reference: https://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container
    vault:
      limits:
        memory: "1024Mi"
        cpu: "1"
      requests:
        memory: "256Mi"
        cpu: "100m"

  volumeMounts:
    - name: vault-raft
      mountPath: /vault/file

  volumeClaimTemplates:
    - metadata:
        name: vault-raft
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
