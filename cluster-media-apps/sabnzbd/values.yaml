---
sabnzbd:
  env:
    HOST_WHITELIST_ENTRIES: sabnzbd.framsburg.ch
    PUID: '666'
    PGID: '666'
  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.middlewares: plex-svc-plex-headers@kubernetescrd
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "SABnzbd"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "sabnzbd.png"
        gethomepage.dev/description: "Usenet downloader"
        gethomepage.dev/pod-selector: ""
        gethomepage.dev/widget.type: "sabnzbd"
        gethomepage.dev/widget.url: "https://sabnzbd.framsburg.ch"
        gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
      hosts:
        - host: 'sabnzbd.framsburg.ch'
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts: ['sabnzbd.framsburg.ch']
          secretName: 'sabnzbd-framsburg-ch-tls'

  persistence:
    config:
      enabled: true
      type: pvc
      size: 2Gi
      retain: true
    downloads:
      enabled: true
      type: pvc
      size: 100Gi
      storageClass: longhorn-nfs-transient-v1
      accessMode: ReadWriteMany
      mountPath: /downloads2
