---
jellyfin:
  image:
    repository: docker.io/jellyfin/jellyfin
    tag: ""  # Uses Chart appVersion (10.11.10)
    pullPolicy: IfNotPresent

  # runtimeClassName: nvidia

  podSecurityContext:
    runAsUser: 666
    runAsGroup: 666
    fsGroup: 666
    fsGroupChangePolicy: Always
    supplementalGroups:
      - 666  # GID that owns the Plex media files

  securityContext: {}

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  jellyfin:
    env:
      - name: TZ
        value: "Europe/Zurich"
      # - name: NVIDIA_VISIBLE_DEVICES
      #   value: "all"
      # - name: NVIDIA_DRIVER_CAPABILITIES
      #   value: "all"

  persistence:
    config:
      enabled: true
      size: 20Gi
      accessMode: ReadWriteOnce
    media:
      enabled: false
    cache:
      enabled: true
      size: 20Gi
      accessMode: ReadWriteOnce

  # Additional volumes for media (read-only, reusing existing Plex PVCs)
  volumes:
    - name: tv-all
      persistentVolumeClaim:
        claimName: plex-tv-all
        readOnly: true
    - name: tv-uhd-all
      persistentVolumeClaim:
        claimName: plex-tv-uhd-all
        readOnly: true
    - name: movies-all
      persistentVolumeClaim:
        claimName: plex-movies-all
        readOnly: true
    - name: movies-uhd-all
      persistentVolumeClaim:
        claimName: plex-movies-uhd-all
        readOnly: true
    - name: audiobooks
      persistentVolumeClaim:
        claimName: plex-audiobooks
        readOnly: true

  volumeMounts:
    - name: tv-all
      mountPath: /mnt/media/tv-all
      readOnly: true
    - name: tv-uhd-all
      mountPath: /mnt/media/tv-uhd-all
      readOnly: true
    - name: movies-all
      mountPath: /mnt/media/movies-all
      readOnly: true
    - name: movies-uhd-all
      mountPath: /mnt/media/movies-uhd-all
      readOnly: true
    - name: audiobooks
      mountPath: /mnt/media/audiobooks
      readOnly: true

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k3sworker07

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      # traefik.ingress.kubernetes.io/router.middlewares: jellyfin-jellyfin-headers@kubernetescrd,jellyfin-jellyfin-buffering@kubernetescrd,authentik-authentik@kubernetescrd
      gethomepage.dev/enabled: "true"
      gethomepage.dev/description: "Movies & TV"
      gethomepage.dev/group: "Watch"
      gethomepage.dev/icon: jellyfin.png
      gethomepage.dev/name: Jellyfin
      gethomepage.dev/widget.type: "jellyfin"
      gethomepage.dev/widget.url: "https://jellyfin.framsburg.ch"
      gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
      # Jellyfin >= 10.12 needs the v2 API (legacy /emby routes are gone)
      gethomepage.dev/widget.version: "2"
      gethomepage.dev/pod-selector: ""
    hosts:
      - host: jellyfin.framsburg.ch
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts: [jellyfin.framsburg.ch]
        secretName: jellyfin-framsburg-ch-tls

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4
      memory: 8192Mi
      # nvidia.com/gpu: 1
