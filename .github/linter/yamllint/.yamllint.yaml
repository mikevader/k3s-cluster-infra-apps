---
ignore: |
  .disabled/
  .ansible/
  .direnv/
  .private/
  .vscode/
  *.sops.*
  ansible/roles/xanmanning.k3s/
  # Helm templates are not plain YAML; linted rendered by .github/scripts/helm-lint.sh
  templates/

extends: default

rules:
  truthy:
    allowed-values: ["true", "false", "on"]

  comments:
    min-spaces-from-content: 1

  line-length: disable

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0

  indentation: enable
