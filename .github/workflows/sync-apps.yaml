---
name: App roots

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    name: All app folders registered
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # yq (mikefarah v4) and python3 are preinstalled on ubuntu-latest
      - name: Check app-of-apps group files
        run: hack/sync-apps.py --check
