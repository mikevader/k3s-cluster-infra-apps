---
name: Lint

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: MegaLinter
        # documentation flavor (~1.35 GB vs ~4.3 GB full image) covers all ENABLE_LINTERS below
        uses: oxsecurity/megalinter/flavors/documentation@v10.2.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PRINT_ALPACA: false
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          ENABLE_LINTERS: |-
            ${{
              join(
                fromJSON('
                  [
                    "ACTION_ACTIONLINT",
                    "ANSIBLE_ANSIBLE_LINT",
                    "COPYPASTE_JSCPD",
                    "KUBERNETES_KUBECONFORM",
                    "KUBERNETES_HELM",
                    "KUBERNETES_KUBESCAPE",
                    "MARKDOWN_MARKDOWNLINT",
                    "REPOSITORY_GIT_DIFF",
                    "REPOSITORY_TRIVY",
                    "YAML_PRETTIER",
                    "YAML_YAMLLINT"
                  ]
                '),
                ','
              )
            }}
          COPYPASTE_JSCPD_CONFIG_FILE: .github/linters/jscpd/jscpd.json
          KUBERNETES_DIRECTORY: any
          KUBERNETES_KUBECONFORM_ARGUMENTS: --ignore-missing-schemas
          # apps-root-config/*/templates/ are Helm templates made of range/if logic, not
          # parseable as plain YAML (yamllint skips them via its own ignore list)
          KUBERNETES_KUBECONFORM_FILTER_REGEX_EXCLUDE: "(Chart.yaml|values.yaml|apps-root-config/[^/]+/templates/)"
          MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .github/linters/markdownlint/markdownlint.yaml
          YAML_YAMLLINT_CONFIG_FILE: .github/linters/yamllint/.yamllint.yaml
          YAML_PRETTIER_CONFIG_FILE: .github/linters/prettier/.prettierrc.yaml
          YAML_PRETTIER_FILTER_REGEX_EXCLUDE: "apps-root-config/[^/]+/templates/"
